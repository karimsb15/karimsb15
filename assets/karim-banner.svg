<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Karim, Backend and Automation Developer</title>
  <desc id="description">A dark developer-console banner with blue and green accents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1726"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#334155" stroke-width="2"/>

  <circle cx="55" cy="48" r="7" fill="#fb7185"/>
  <circle cx="79" cy="48" r="7" fill="#fbbf24"/>
  <circle cx="103" cy="48" r="7" fill="#4ade80"/>
  <text x="142" y="55" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">karim@dev: ~/projects</text>

  <text x="54" y="132" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">$ whoami</text>
  <text x="54" y="205" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Karim</text>
  <text x="55" y="253" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">Backend &amp; Automation Developer</text>
  <text x="55" y="304" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Python  /  APIs  /  Playwright  /  learning PyTorch</text>

  <g transform="translate(938 177)" filter="url(#soft-glow)">
    <path d="M-82 0h42l22-48 42 96 23-48h39" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-82" cy="0" r="7" fill="#4ade80"/>
    <circle cx="86" cy="0" r="7" fill="#4ade80"/>
  </g>

  <text x="1137" y="329" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">ship &gt; hype</text>
</svg>
